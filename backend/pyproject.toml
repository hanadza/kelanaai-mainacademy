[project]
name = "kelanaai-backend"
version = "0.1.0"
description = "KelanaAI FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "boto3==1.43.56",
    "certifi>=2024.8.30",
    "bcrypt>=4.0.1",
    "python-jose[cryptography]>=3.3.0",
    "google-auth>=2.20.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
